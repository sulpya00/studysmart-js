services:
  postgres:
    image: postgres:16-alpine
    container_name: studysmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studysmart
    ports:
      - "5432:5432"
    volumes:
      - studysmart_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studysmart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studysmart_postgres_data:
